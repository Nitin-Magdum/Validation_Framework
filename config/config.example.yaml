app_name: DataValidationFramework

spark_config:
  spark.master: "local[*]"
  spark.driver.extraClassPath: "/path/to/jars/postgresql-42.2.18.jar"
  spark.jars: "/path/to/jars/postgresql-42.2.18.jar"

# ── Default Source DB ──────────────────────────────────────────────────────
source_db:
  type: csv                              # csv | parquet | json | jdbc
  path: "/path/to/data/source/"
  format_options:
    header: "true"
    inferSchema: "true"

# ── Default Target DB ──────────────────────────────────────────────────────
target_db:
  type: csv
  path: "/path/to/data/target/"
  format_options:
    header: "true"
    inferSchema: "true"

# ── Result DB — PostgreSQL ─────────────────────────────────────────────────
result_db:
  type: jdbc
  url: "jdbc:postgresql://localhost:5432/your_database"
  user: your_pg_user
  password: "your_password"
  driver: org.postgresql.Driver
  summary_table: validation_summary
  error_table: validation_errors

# ── Tables to Validate ─────────────────────────────────────────────────────
tables_to_validate:
  - primary_key: emp_id
    source:
      table_name: employees.csv          # file name (csv) or table name (jdbc)
      schema: ""                         # blank for file-based sources
      # db:                              # optional: override source_db per table
      #   type: jdbc
      #   url: "jdbc:postgresql://source-host:5432/source_db"
      #   user: source_user
      #   password: "source_pass"
      #   driver: org.postgresql.Driver
    target:
      table_name: employees.csv          # can differ from source table name
      schema: ""
      # db:                              # optional: override target_db per table
      #   type: jdbc
      #   url: "jdbc:postgresql://target-host:5432/target_db"
      #   user: target_user
      #   password: "target_pass"
      #   driver: org.postgresql.Driver
